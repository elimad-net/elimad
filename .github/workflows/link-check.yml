name: link-check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # 매주 월요일 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links (index + styles + scripts)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'mailto:'
            --exclude 'http://elimad.net'
            --exclude 'http://m.elimad.net'
            --exclude 'http://m.smartstore.naver.com'
            'index.html'
            'README.md'
          fail: true
