name: opencode

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode:
    # Only run if comment contains /opencode or /oc
    if: |
      (github.event_name == 'issue_comment' && 
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'pull_request_review_comment' && 
       (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))) ||
      (github.event_name == 'issues' && contains(github.event.label.name, 'opencode')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OpenCode
        uses: opencode-ai/opencode-action@main
        with:
          # Choose your AI provider - add the corresponding secret to your repo
          # For Anthropic Claude (recommended):
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # For OpenAI GPT:
          # openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          # For Google Gemini:
          # google_api_key: ${{ secrets.GOOGLE_API_KEY }}
