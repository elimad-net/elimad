<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="koeiaOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#E8431E" />
    </linearGradient>
    <linearGradient id="koeiaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B93FF" />
      <stop offset="100%" stop-color="#3B72E6" />
    </linearGradient>
  </defs>

  <!-- 4 Blue Node People Circles -->
  <circle cx="100" cy="26" r="13" fill="url(#koeiaBlue)" />
  <circle cx="100" cy="174" r="13" fill="url(#koeiaBlue)" />
  <circle cx="26" cy="100" r="13" fill="url(#koeiaBlue)" />
  <circle cx="174" cy="100" r="13" fill="url(#koeiaBlue)" />

  <!-- Horizontal Graphite Loop (Back Part) -->
  <rect x="40" y="72" width="120" height="56" rx="28" fill="none" stroke="#2D3748" stroke-width="13" stroke-linecap="round" />

  <!-- Vertical Orange Loop (Interlocking) -->
  <rect x="72" y="40" width="56" height="120" rx="28" fill="none" stroke="url(#koeiaOrange)" stroke-width="13" stroke-linecap="round" />

  <!-- Horizontal Loop Interlocking Overlap Arc -->
  <path d="M 40 100 A 28 28 0 0 1 68 72 L 80 72" fill="none" stroke="#2D3748" stroke-width="13" stroke-linecap="round" />
  <path d="M 120 128 L 132 128 A 28 28 0 0 0 160 100" fill="none" stroke="#2D3748" stroke-width="13" stroke-linecap="round" />
</svg>
